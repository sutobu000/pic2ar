<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>pic2ar</title>
<!-- model-viewerはバージョン完全固定(挙動の再現性のため) -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #0b0d10;
    --panel: rgba(255, 255, 255, 0.06);
    --line: rgba(255, 255, 255, 0.09);
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #7ab8ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 800px at 70% -10%, #16202c 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 18px 0;
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  header .brand {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }
  model-viewer {
    flex: 1;
    width: 100%;
    min-height: 0;
    --poster-color: transparent;
    --progress-bar-color: var(--accent);
    --progress-bar-height: 2px;
  }
  footer {
    padding: 0 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .hint {
    font-size: 13px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    width: fit-content;
    max-width: 100%;
  }
  .sub {
    font-size: 11px;
    color: var(--muted);
  }
  .sub a { color: var(--accent); text-decoration: none; }
  .sub a:active { opacity: 0.7; }
  #error {
    display: none;
    font-size: 12px;
    color: #ff8a80;
  }
  .models {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 2px 8px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .models::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    line-height: 1.3;
    cursor: pointer;
    transition: border-color .18s ease, background .18s ease, transform .12s ease;
  }
  .chip:hover { transform: translateY(-1px); border-color: rgba(122, 184, 255, .55); }
  .chip:active { transform: translateY(0); }
  .chip.active { border-color: var(--accent); background: rgba(122, 184, 255, .14); }
  .chip .sub2 { font-size: 10px; color: var(--muted); }
  .chip.active .sub2 { color: var(--accent); }
</style>
</head>
<body>
<header>
  <span class="brand">pic2ar</span>
  <h1 id="model-name">model</h1>
</header>

<model-viewer
  id="viewer"
  data-title="テストモデル(トーラスノット)"
  src="./assets/model.glb"
  ios-src="./assets/model.usdz"
  alt="写真から生成した3Dモデル"
  ar
  ar-modes="quick-look webxr scene-viewer"
  camera-controls
  auto-rotate
  auto-rotate-delay="1500"
  shadow-intensity="1"
  shadow-softness="0.8"
  exposure="1"
  interaction-prompt="auto">
</model-viewer>

<footer>
  <div class="models" id="models" aria-label="モデル選択"></div>
  <div class="hint">iPhoneではARボタンで部屋に置けます（Safariで開いてください）</div>
  <div class="sub">
    実寸スケール配置（1unit=1m）／PCはドラッグで回転・ホイールでズーム／
    ARが始まらない場合は<a id="usdz-link" href="./assets/model.usdz">.usdzを直接開く</a>
  </div>
  <div id="error"></div>
</footer>

<script type="module">
  const viewer = document.getElementById('viewer');
  const nameEl = document.getElementById('model-name');
  const usdzLink = document.getElementById('usdz-link');
  const listEl = document.getElementById('models');

  // モデルの表示名と並び順(任意)。assets/に置いたglbは書かなくても自動でリストに載る
  // (その場合はファイル名がそのまま表示され、新しい順に先頭へ並ぶ)。
  const META = {
    // 'mymodel': { label: '表示名', sub: '補足', order: 1 },
  };

  // フォールバック表示(リスト取得前・取得失敗時)はdata-title＋既定のmodel.*のまま
  nameEl.textContent = viewer.dataset.title || 'model';
  document.title = `pic2ar | ${nameEl.textContent}`;

  function apply(m) {
    viewer.setAttribute('src', m.glb);
    if (m.usdz) viewer.setAttribute('ios-src', m.usdz);
    else viewer.removeAttribute('ios-src');
    const label = META[m.id]?.label ?? m.id;
    nameEl.textContent = label;
    document.title = `pic2ar | ${label}`;
    usdzLink.href = m.usdz ?? m.glb;
    history.replaceState(null, '', `#m=${encodeURIComponent(m.id)}`);
    for (const b of listEl.children) b.classList.toggle('active', b.dataset.id === m.id);
  }

  function chip(m) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.id = m.id;
    const meta = META[m.id];
    const name = document.createElement('span');
    name.textContent = (meta?.label ?? m.id) + (m.usdz ? '' : '（AR不可）');
    const sub = document.createElement('span');
    sub.className = 'sub2';
    sub.textContent = meta?.sub ?? '生成モデル';
    b.append(name, sub);
    b.addEventListener('click', () => apply(m));
    return b;
  }

  try {
    const res = await fetch('/api/models', { cache: 'no-store' });
    const models = await res.json();
    models.sort((a, b) => {
      const oa = META[a.id]?.order, ob = META[b.id]?.order;
      if (oa != null && ob != null) return oa - ob;
      if (oa == null && ob == null) return b.mtime - a.mtime; // 未知同士は新しい順
      return oa == null ? -1 : 1;                             // 未知(新規生成)を先頭へ
    });
    for (const m of models) listEl.append(chip(m));
    const want = new URLSearchParams(location.hash.slice(1)).get('m');
    const initial = models.find((x) => x.id === want) ?? models[0];
    if (initial) apply(initial);
  } catch (e) {
    console.warn('model list unavailable, falling back to model.glb', e);
  }

  viewer.addEventListener('error', (e) => {
    const el = document.getElementById('error');
    el.style.display = 'block';
    el.textContent = `モデルの読み込みに失敗しました: ${e.detail?.type ?? 'unknown'}（assets/内のglbを確認してください）`;
  });
</script>
</body>
</html>
