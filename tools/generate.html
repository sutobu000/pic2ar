<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>glb/usdz generator (headless)</title>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';

/** Builds a 1024px canvas texture (gradient + grid + noise + label). */
function makeTexture() {
  const size = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#1a2a6c');
  grad.addColorStop(0.5, '#b03a3a');
  grad.addColorStop(1, '#e8b23a');
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  g.strokeStyle = 'rgba(255,255,255,0.35)';
  g.lineWidth = 2;
  for (let i = 0; i <= 16; i++) {
    const p = (i / 16) * size;
    g.beginPath(); g.moveTo(p, 0); g.lineTo(p, size); g.stroke();
    g.beginPath(); g.moveTo(0, p); g.lineTo(size, p); g.stroke();
  }
  // 微細ノイズを乗せる(単色面ばかりだとPNGが小さくなりすぎ、実データに近い負荷にならないため)
  const img = g.getImageData(0, 0, size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 24;
    img.data[i] += n;
    img.data[i + 1] += n;
    img.data[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
  g.fillStyle = '#ffffff';
  g.textAlign = 'center';
  g.font = 'bold 96px sans-serif';
  g.fillText('PHOTO-TO-AR', size / 2, size / 2 - 24);
  g.font = '44px sans-serif';
  g.fillText('test model', size / 2, size / 2 + 52);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/** Builds the test scene: a textured torus knot, about 30 cm real-world size. */
function buildScene() {
  const scene = new THREE.Scene();
  // AR Quick Lookは1unit=1mの実寸配置なので、卓上に置ける約30cmに収める
  const geo = new THREE.TorusKnotGeometry(0.10, 0.035, 256, 48);
  const mat = new THREE.MeshStandardMaterial({
    map: makeTexture(),
    metalness: 0.35,
    roughness: 0.4
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = 'test-knot';
  // 床にちょうど接地するよう、バウンディングボックスの底をy=0へ持ち上げる
  geo.computeBoundingBox();
  mesh.position.y = -geo.boundingBox.min.y;
  scene.add(mesh);
  return scene;
}

function toBase64(buf) {
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode(...bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

function fromBase64(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

/** Exports the generated test scene as a binary glTF (.glb), base64-encoded. */
window.makeGLB = async () => {
  const scene = buildScene();
  const exporter = new GLTFExporter();
  const glb = await exporter.parseAsync(scene, { binary: true });
  return toBase64(glb);
};

/** Loads a .glb (base64) with GLTFLoader and re-exports it as .usdz (base64). */
window.glbToUSDZ = async (glbB64) => {
  const loader = new GLTFLoader();
  const gltf = await loader.parseAsync(fromBase64(glbB64), '');
  const scene = gltf.scene || gltf.scenes[0];
  const exporter = new USDZExporter();
  let usdz;
  if (typeof exporter.parseAsync === 'function') {
    usdz = await exporter.parseAsync(scene);
  } else {
    // 旧three(コールバック型API)向けのフォールバック
    usdz = await new Promise((resolve, reject) => {
      const r = exporter.parse(scene, resolve, reject);
      if (r && typeof r.then === 'function') r.then(resolve, reject);
    });
  }
  return toBase64(usdz);
};

window.__ready = true;
</script>
</body>
</html>
